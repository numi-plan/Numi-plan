<script>
/* ====================================================================
 * SYSTEME DE PROTECTION ET CHIFFREMENT ACTIF - ANTI-INSPECTION
 * TOUTE TENTATIVE D'ACCES NON AUTORISE EST BLOQUEE ET ENREGISTREE
 * ==================================================================== */
(function(){
  "use strict";

  // 1. Désactivation stricte du clic droit (menu contextuel)
  document.addEventListener("contextmenu", function(e){
    e.preventDefault();
    e.stopPropagation();
    return false;
  }, true);

  // 2. Blocage des raccourcis clavier de développement & d'inspection
  window.addEventListener("keydown", function(e){
    // F12
    if (e.keyCode === 123 || e.key === "F12") {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
    // Ctrl + Shift + I (Inspecteur)
    // Ctrl + Shift + J (Console)
    // Ctrl + Shift + C (Inspecteur d'éléments)
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && 
        (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67 || 
         e.key === "I" || e.key === "J" || e.key === "C" || 
         e.key === "i" || e.key === "j" || e.key === "c")) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
    // Ctrl + U (Afficher le code source)
    if ((e.ctrlKey || e.metaKey) && (e.keyCode === 85 || e.key === "u" || e.key === "U")) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
    // Ctrl + S (Sauvegarder la page)
    if ((e.ctrlKey || e.metaKey) && (e.keyCode === 83 || e.key === "s" || e.key === "S")) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  }, true);

  // 3. Boucle infernale Debugger Trap
  // Dès que la console ou l'inspecteur est ouvert, le navigateur est figé en continu
  function _0xdbg() {
    try {
      (function(a){
        return (function(b){
          return Function('return (function() {}.constructor("debugger")())')();
        })(a);
      })()();
    } catch(err){}
  }
  setInterval(_0xdbg, 60);

  // 4. Neutralisation et verrouillage total de la console
  try {
    var _noop = function(){};
    var _methods = [
      "log", "debug", "info", "warn", "error", "dir", "dirxml", 
      "table", "trace", "clear", "count", "assert", "profile", "time", "timeEnd"
    ];
    for (var i = 0; i < _methods.length; i++) {
      try {
        window.console[_methods[i]] = _noop;
      } catch(err){}
    }
    try { Object.freeze(window.console); } catch(err){}
  } catch(e){}

  // 5. Détection dynamique de l'ouverture de la console via Getter d'objet
  var _detected = false;
  function _onDevToolsDetected() {
    if (_detected) return;
    _detected = true;
    try {
      document.body.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0f172a;color:#ef4444;font-family:sans-serif;font-weight:bold;font-size:18px;text-align:center;padding:24px;line-height:1.6;">' +
        '<span>Accès sécurisé refusé : Outils de développement détectés.</span>' +
        '<span style="font-size:13px;color:#94a3b8;font-weight:normal;margin-top:10px;">Fermez les outils de développement (DevTools/Console) pour continuer.</span>' +
        '</div>';
    } catch(e){}
    setTimeout(function(){
      try { window.location.reload(); } catch(e){}
    }, 1500);
  }

  try {
    var _probe = new Image();
    Object.defineProperty(_probe, "id", {
      get: function(){
        _onDevToolsDetected();
      }
    });
    setInterval(function(){
      try {
        window.console.log(_probe);
        window.console.clear();
      } catch(e){}
    }, 1200);
  } catch(e){}

})();
</script>
