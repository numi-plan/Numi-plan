<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharik — Tableau de Bord Performance TV</title>
  
  <!-- Font Google Inter & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CDN Bibliothèques : Chart.js, Supabase Client et SheetJS Excel -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <style>
    :root {
      --bg-dark: #070a13;
      --bg-card: rgba(17, 24, 39, 0.85);
      --border-color: rgba(30, 41, 59, 0.8);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-blue: #0284c7;
      --accent-sky: #38bdf8;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-orange: #f59e0b;
      --glow-blue: rgba(14, 165, 233, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, sans-serif;
    }

    body {
      background: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #0d1e3d 0%, #070a13 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* En-tête du Dashboard */
    header {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title-container {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-pulse {
      width: 12px;
      height: 12px;
      background: var(--accent-sky);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-sky);
      animation: pulse-glow 2s infinite;
    }

    @keyframes pulse-glow {
      0% { transform: scale(0.9); box-shadow: 0 0 4px var(--accent-sky); }
      50% { transform: scale(1.1); box-shadow: 0 0 15px var(--accent-sky); }
      100% { transform: scale(0.9); box-shadow: 0 0 4px var(--accent-sky); }
    }

    h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Filtres et Actions */
    .controls {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .date-filter-group {
      display: flex;
      align-items: center;
      background: rgba(9, 13, 22, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px 8px;
      gap: 8px;
    }

    .date-filter-group label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .date-filter-group input[type="date"] {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-blue), #0369a1);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
    }

    .btn-green {
      background: linear-gradient(135deg, var(--accent-green), #047857);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-green:hover {
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
    }

    .btn-tv-mode {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border-color);
      box-shadow: none;
    }

    .btn-tv-mode.active {
      background: linear-gradient(135deg, var(--accent-orange), #d97706);
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
      animation: pulse-orange 1.5s infinite;
    }

    @keyframes pulse-orange {
      0% { box-shadow: 0 0 4px rgba(245, 158, 11, 0.4); }
      50% { box-shadow: 0 0 16px rgba(245, 158, 11, 0.7); }
      100% { box-shadow: 0 0 4px rgba(245, 158, 11, 0.4); }
    }

    /* Onglets de Navigation */
    .tabs-bar {
      display: flex;
      justify-content: center;
      background: rgba(15, 23, 42, 0.4);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 0;
      gap: 15px;
    }

    .tab-link {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-link:hover {
      color: var(--text-main);
      background: rgba(255,255,255,0.05);
    }

    .tab-link.active {
      color: white;
      background: var(--accent-blue);
      box-shadow: 0 2px 10px rgba(2, 132, 199, 0.4);
    }

    /* Conteneur principal */
    main {
      flex: 1;
      padding: 25px 30px;
      max-width: 1800px;
      margin: 0 auto;
      width: 100%;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Grille des KPI Cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .kpi-card {
      background: var(--bg-card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: var(--accent-blue);
    }

    .kpi-card.green::before { background: var(--accent-green); }
    .kpi-card.red::before { background: var(--accent-red); }
    .kpi-card.orange::before { background: var(--accent-orange); }

    .kpi-info h3 {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .kpi-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--text-main);
    }

    .kpi-subtext {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .kpi-icon {
      font-size: 26px;
      opacity: 0.25;
      color: var(--text-muted);
    }

    .kpi-card.blue .kpi-icon { color: var(--accent-sky); opacity: 0.4; }
    .kpi-card.green .kpi-icon { color: var(--accent-green); opacity: 0.4; }
    .kpi-card.red .kpi-icon { color: var(--accent-red); opacity: 0.4; }
    .kpi-card.orange .kpi-icon { color: var(--accent-orange); opacity: 0.4; }

    /* Grille des Graphiques */
    .charts-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      margin-bottom: 25px;
    }

    @media (max-width: 1024px) {
      .charts-grid-2 {
        grid-template-columns: 1fr;
      }
    }

    .chart-card {
      background: var(--bg-card);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      min-height: 400px;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 10px;
    }

    .chart-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chart-title i {
      color: var(--accent-sky);
    }

    .chart-container {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      min-height: 300px;
    }

    /* Liste des Pannes défilante (Ticker TV) */
    .ticker-section {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px 25px;
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 20px;
      overflow: hidden;
      position: relative;
    }

    .ticker-label {
      background: #ef4444;
      color: white;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      box-shadow: 0 0 10px rgba(239,68,68,0.4);
    }

    .ticker-wrapper {
      flex: 1;
      overflow: hidden;
      position: relative;
      height: 24px;
    }

    .ticker-content {
      display: flex;
      gap: 40px;
      position: absolute;
      white-space: nowrap;
      will-change: transform;
      animation: ticker-move 120s linear infinite;
    }

    .ticker-item {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ticker-item .ticker-dot {
      width: 8px;
      height: 8px;
      background: #f59e0b;
      border-radius: 50%;
    }

    @keyframes ticker-move {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* Modal de Connexion */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(7, 10, 19, 0.95);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .login-card {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 16px;
      width: 420px;
      padding: 35px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: scaleUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes scaleUp {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .login-logo {
      font-size: 40px;
      color: var(--accent-sky);
      margin-bottom: 15px;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }

    .login-card h2 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .login-card p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 25px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      color: white;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: var(--accent-sky);
    }

    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-blue), #0369a1);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s;
    }

    .login-btn:hover {
      transform: translateY(-1px);
    }

    /* Masquer l'input file d'import */
    #csv-file-input {
      display: none;
    }

    /* Style de la table des pannes */
    .table-container {
      overflow-x: auto;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: rgba(15, 23, 42, 0.7);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 14px 16px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,0.02);
      color: var(--text-main);
    }

    tr:hover td {
      background: rgba(255,255,255,0.01);
    }

    .badge-red {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .badge-green {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
  </style>
</head>
<body>

  <!-- MODAL DE CONNEXION SUPABASE -->
  <div id="login-modal" class="modal-overlay">
    <div class="login-card">
      <div class="login-logo"><i class="fa-solid fa-satellite-dish"></i></div>
      <h2>Connexion Sharik TV</h2>
      <p>Entrez vos accès administrateur ou équipe pour charger les données opérationnelles en temps réel.</p>
      
      <div class="form-group">
        <label>Adresse Email</label>
        <input type="email" id="login-email" class="form-input" placeholder="ex: admin@sharik.numilog.com" value="admin@sharik.numilog.com">
      </div>
      
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="login-password" class="form-input" placeholder="••••••••" value="Sharik@admin">
      </div>
      
      <button class="login-btn" onclick="handleLogin()">Se connecter</button>
    </div>
  </div>

  <!-- EN-TÊTE -->
  <header>
    <div class="header-title-container">
      <div class="logo-pulse"></div>
      <h1>SHARIK — PERFORMANCE TV</h1>
    </div>
    
    <div class="controls">
      <!-- Filtre Agence -->
      <div class="date-filter-group" style="gap: 8px;">
        <label><i class="fa-solid fa-building"></i> Agence</label>
        <select id="agency-filter" onchange="refreshData()" class="form-input" style="width: 140px; padding: 4px 8px; font-size: 13px; background: rgba(15,23,42,0.8); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; cursor: pointer; height: 34px;">
          <option value="ALL">Toutes</option>
          <option value="A">Agence A</option>
          <option value="B">Agence B</option>
          <option value="C">Agence C</option>
          <option value="D">Agence D</option>
          <option value="AB">Agences A + B</option>
          <option value="CD">Agences C + D</option>
        </select>
      </div>
      
      <!-- Filtre Date/Période -->
      <div class="date-filter-group">
        <label>Du</label>
        <input type="date" id="date-start" onchange="refreshData()">
        <label>Au</label>
        <input type="date" id="date-end" onchange="refreshData()">
      </div>
      
      <!-- Bouton Import CSV -->
      <label for="csv-file-input" class="btn btn-green">
        <i class="fa-solid fa-file-import"></i> Import Commande
      </label>
      <input type="file" id="csv-file-input" accept=".csv" onchange="handleFileImport(event)">
      
      <!-- Bouton Détails KM -->
      <button onclick="openKmDetailsModal()" class="btn" style="background: rgba(56, 189, 248, 0.2); border: 1px solid var(--accent-sky); color: var(--accent-sky); padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; height: 34px; line-height: 1;">
        <i class="fa-solid fa-list-check"></i> Détail KM
      </button>
      
      <!-- Mode TV Défilement automatique -->
      <button id="btn-tv" class="btn btn-tv-mode" onclick="toggleTvMode()">
        <i class="fa-solid fa-desktop"></i> Mode TV Auto
      </button>
    </div>
  </header>


  <!-- ZONE PRINCIPALE -->
  <main>
    
    <!-- CONTAINER DYNAMIQUE DES KPIs PAR AGENCE -->
    <div id="kpis-container"></div>




    <!-- TICKER D'INFORMATIONS TV -->
    <div class="ticker-section">
      <div class="ticker-label" onclick="openFlashManagerModal()" style="cursor: pointer;" title="Gérer le fil d'info flash"><i class="fa-solid fa-bell"></i> Fil Info Flash</div>
      <div class="ticker-wrapper">
        <div id="ticker-content" class="ticker-content">
          <div class="ticker-item"><span class="ticker-dot"></span>Bienvenue sur le Tableau de bord de Performance Sharik</div>
          <div class="ticker-item"><span class="ticker-dot"></span>Importez les segments journaliers pour actualiser les rendements d'équipe</div>
        </div>
      </div>
    </div>

  </main>

  <!-- SCRIPTS LOGIQUE ET RENDU -->
  <script>
    const SUPABASE_URL = "https://mfljrozyxyfkymzlnsmt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_sMb9uHOr4gpyqmZGrkY-YQ_z90TgNAB";
    
    let supabaseClient = null;
    let rawCsvData = [];
    let rawPannesData = [];
    let charts = {};
    let tvInterval = null;
    let activeTabIndex = 0;
    
    // Détection de l'inactivité / TV Mode auto
    let isTvModeActive = false;

    // Initialisation
    window.addEventListener('DOMContentLoaded', async () => {
      // 1. Initialiser les dates du filtre (Aujourd'hui par défaut pour une vitesse maximale sur TV)
      const now = new Date();
      const today = now.toISOString().split('T')[0];
      
      document.getElementById('date-start').value = today;
      document.getElementById('date-end').value = today;

      // 2. Tenter de récupérer la session existante
      // Restaurer le cache des segments si présent
      try {
        const cachedCsv = localStorage.getItem('sharik_tv_raw_csv');
        if (cachedCsv) {
          rawCsvData = JSON.parse(cachedCsv);
        }
      } catch(e) {}

      const savedSession = localStorage.getItem('supabase.auth.token');
      if (savedSession) {
        try {
          supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
          await refreshData();
        } catch (e) {
          console.warn("Session expirée ou invalide", e);
          document.getElementById('login-modal').classList.add('active');
        }
      } else {
        document.getElementById('login-modal').classList.add('active');
      }

      // 3. Lancer la surveillance des POI blacklistés en temps réel et arrière-plan
      setInterval(checkPoiAlerts, 15000); // 15s (Filet de sécurité ultra-rapide)
      setTimeout(checkPoiAlerts, 3000);

      // Abonnement Realtime instantané pour les alertes Blacklist (< 100ms)
      if (supabaseClient && !window.tvRealtimePoiChannel) {
        window.tvRealtimePoiChannel = supabaseClient
          .channel('tv-realtime-poi-alerts')
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'np_poi_visits' },
            payload => {
              console.log("⚡ [TV Realtime] Événement visite POI détecté :", payload);
              checkPoiAlerts();
            }
          )
          .on(
            'broadcast',
            { event: 'blacklist_alert_broadcast' },
            e => {
              console.log("🚨 [TV Broadcast] Alerte Blacklist reçue :", e.payload);
              if (e.payload) {
                showBlacklistAlertModal(e.payload.truck, e.payload.client, e.payload.time, e.payload.team);
              }
            }
          )
          .subscribe();
      }

      // 4. Rafraîchir les données de performance Supabase automatiquement toutes les 5 minutes
      setInterval(refreshData, 300000);
    });

    // Gestion de connexion Supabase
    async function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      
      if (!email || !password) {
        alert("Veuillez remplir tous les champs.");
        return;
      }

      try {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        
        document.getElementById('login-modal').classList.remove('active');
        await refreshData();
      } catch (err) {
        alert("Erreur de connexion : " + err.message);
      }
    }

    // Commutation d'onglets
    function switchTab(tabId, element) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-link').forEach(link => link.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      if (element) element.classList.add('active');
      
      // Update active tab tracker for TV slide rotation
      const links = Array.from(document.querySelectorAll('.tab-link'));
      activeTabIndex = links.indexOf(element);
    }

    // Alerte sonore pour client blacklisté (Web Audio API)
    function playBlacklistAlarm() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        let osc1 = audioCtx.createOscillator();
        let gain1 = audioCtx.createGain();
        osc1.type = 'sawtooth';
        osc1.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc1.frequency.linearRampToValueAtTime(1000, audioCtx.currentTime + 0.3);
        osc1.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.6);
        osc1.frequency.linearRampToValueAtTime(1000, audioCtx.currentTime + 0.9);
        osc1.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 1.2);
        
        gain1.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
        
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        
        osc1.start();
        osc1.stop(audioCtx.currentTime + 1.5);
      } catch (err) {
        console.warn("Impossible de jouer l'alarme audio:", err);
      }
    }

    async function checkPoiAlerts() {
      if (!supabaseClient) return;

      try {
        // Récupérer TOUTES les visites en cours sur TOUTES les équipes confondues
        const { data: activeVisits, error: errV } = await supabaseClient
          .from('np_poi_visits')
          .select('id,v,poi_name,arrived_at,team')
          .is('left_at', null);
        
        if (errV) throw errV;
        if (!activeVisits || activeVisits.length === 0) return;

        const { data: pois, error: errP } = await supabaseClient
          .from('np_pois')
          .select('name,is_blacklist');
        if (errP) throw errP;
        const blacklistPois = new Set(pois ? pois.filter(p => p.is_blacklist).map(p => p.name) : []);

        let tvAlertedSet = new Set(JSON.parse(sessionStorage.getItem('tv_alerted_blacklist_ids') || '[]'));

        for (const v of activeVisits) {
          const isBlacklisted = blacklistPois.has(v.poi_name);
          if (isBlacklisted) {
            if (!tvAlertedSet.has(v.id)) {
              tvAlertedSet.add(v.id);
              sessionStorage.setItem('tv_alerted_blacklist_ids', JSON.stringify([...tvAlertedSet]));
              const timeStr = new Date(v.arrived_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

              showBlacklistAlertModal(v.v, v.poi_name, timeStr, v.team);
            }
          }
        }
      } catch (e) {
        console.error('Error checking global POI alerts:', e);
      }
    }

      const text = document.getElementById('new-flash-text').value.trim();

      const targets = [];
      document.querySelectorAll('input[name="flash-target"]:checked').forEach(cb => {
        targets.push(cb.value);

      if (targets.length === 0) {
        alert("Sélectionnez au moins une agence cible.");
        return;

      const todayStr = new Date().toISOString().split('T')[0];

      try {
        for (const t of targets) {
          const newId = 'flash_' + Date.now() + '_' + t;
          const { error } = await supabaseClient
            .from('np_flash_infos')
            .insert({

              titre: text,
              contenu: text,
              auteur: 'TV',

              lu_par: []

        }

        document.getElementById('modal-flash-manager').remove();
        await refreshData();

        alert("Erreur lors de la publication : " + err.message);

    function filterKmModalTable() {
      const query = document.getElementById('km-modal-search').value.trim().toUpperCase();
      const agency = document.getElementById('km-modal-agency').value;
      const tbody = document.getElementById('km-modal-tbody');
      
      if (!tbody || !window.KM_MODAL_LIST) return;

      const filtered = window.KM_MODAL_LIST.filter(row => {
        if (query) {
          const matchTruck = row.v.toUpperCase().includes(query);
          const matchDriver = row.chauffeur.toUpperCase().includes(query);
          if (!matchTruck && !matchDriver) return false;
        }
        if (agency !== 'ALL') {
          const rowAgency = (row.agence || '').trim().toUpperCase();
          // Filtre intelligent : cherche le code d'agence entouré de délimiteurs de mots ou après PART/AGENCE/EQ
          const rx = new RegExp('(^|\\s|PART\\s+|AGENCE\\s+|EQ\\s+|EQUIPE\\s+)' + agency + '(\\s+|$)', 'i');
          if (!rx.test(rowAgency)) {
            return false;
          }
        }
        return true;
      });

      let totalKm = 0;
      let totalSegs = 0;
      let rowsHtml = '';

      if (filtered.length > 0) {
        filtered.forEach(row => {
          totalKm += row.km;
          totalSegs += row.segmentsCount;

          const uniqueDays = row.dates.size || 1;
          const avgPerDay = row.km / uniqueDays;
          
          const panneStyle = row.pannesCount > 0 ? 'color:#ef4444; font-weight:700;' : 'color:var(--text-muted);';
          const panneText = row.pannesCount > 0 ? `🛠️ ${row.pannesCount}` : '0';

              <td style="padding: 10px 12px; text-align: right; font-weight: 600; color: var(--text-main);">${row.segmentsCount}</td>
              <td style="padding: 10px 12px; text-align: right; font-weight: 600; color: var(--accent-orange);">${Math.round(avgPerDay).toLocaleString('fr-FR')} KM/j</td>
              <td style="padding: 10px 12px; text-align: right; font-weight: 700; color: var(--accent-sky);">${row.km.toLocaleString('fr-FR')} KM</td>
              <td style="padding: 10px 12px; text-align: right; ${panneStyle}">${panneText}</td>

    // Vérifier si une équipe passe le filtre sélectionné
    function isTeamInFilter(team, filterValue) {
      if (!team) return false;
      const t = team.trim().toUpperCase();
      if (filterValue === 'ALL') return true;
      if (filterValue === 'A') return t === 'A';
      if (filterValue === 'B') return t === 'B';
      if (filterValue === 'C') return t === 'C';
      if (filterValue === 'D') return t === 'D';
      if (filterValue === 'AB') return t === 'A' || t === 'B';
      if (filterValue === 'CD') return t === 'C' || t === 'D';
      return false;
    }

    // Vérifier si un segment passe le filtre sélectionné
    function isSegmentInFilter(s, filterValue, truckToTeamMap) {
      const immat = (s.tracteur || '').trim().toUpperCase();
      let targetTeam = truckToTeamMap[immat];
      
      // Si non trouvé par l'immatriculation, essayer de deviner par le nom de l'agence (ex: "PART A" -> A)
      if (!targetTeam && s.agence) {
        const agUpper = s.agence.toUpperCase();
        if (agUpper.includes('PART A') || agUpper.includes('AGENCE A') || agUpper === 'A') targetTeam = 'A';
        else if (agUpper.includes('PART B') || agUpper.includes('AGENCE B') || agUpper === 'B') targetTeam = 'B';
        else if (agUpper.includes('PART C') || agUpper.includes('AGENCE C') || agUpper === 'C') targetTeam = 'C';
        else if (agUpper.includes('PART D') || agUpper.includes('AGENCE D') || agUpper === 'D') targetTeam = 'D';
      }
      
      if (!targetTeam) {
        return filterValue === 'ALL';
      }
      
      return isTeamInFilter(targetTeam, filterValue);
    }

    // Récupérer et rafraîchir toutes les données de Supabase et ré-appliquer les calculs
    async function refreshData() {
      if (!supabaseClient) return;

      const startDate = document.getElementById('date-start').value;
      const endDate = document.getElementById('date-end').value;
      const agencyFilter = document.getElementById('agency-filter').value;

      try {
        // 0. Chargement automatique de toutes les équipes depuis numiplan_teams (Odomètre, RAC, Activités)
        window.NUMIPLAN_TEAMS_MAP = window.NUMIPLAN_TEAMS_MAP || {};
        try {
          const { data: teamsData, error: errT } = await supabaseClient
            .from('numiplan_teams')
            .select('team, payload');
          if (!errT && teamsData) {
            const allActivite = [];
            teamsData.forEach(t => {
              if (t.team && t.payload) {
                window.NUMIPLAN_TEAMS_MAP[t.team] = t.payload;
              }
              const p = t.payload;
              if (p && rawCsvData.length === 0) {
                if (p.activite && Array.isArray(p.activite)) {
                  p.activite.forEach(act => {
                    allActivite.push({
                      date: act.date || act.date_op || '',
                      tracteur: (act.tr || act.tracteur || '').toUpperCase(),
                      agence: t.team || 'A',
                      chauffeur: act.chauffeur || '—',
                      marchandise: act.marchandise || act.client || '—',
                      csr: act.csr || '—',
                      statut: act.statut || act.etat || '—',
                      km: parseFloat(act.km) || parseFloat(act.km_reel) || parseFloat(act.kmFacture) || 0
                    });
                  });
                }
                if (p.perfRaw && Array.isArray(p.perfRaw)) {
                  p.perfRaw.forEach(prf => {
                    allActivite.push({
                      date: (prf.date ? String(prf.date).split('T')[0] : ''),
                      tracteur: (prf.tracteur || prf.tr || '').toUpperCase(),
                      agence: prf.agence || t.team || 'A',
                      chauffeur: prf.chauffeur || '—',
                      marchandise: prf.marchandise || '—',
                      csr: prf.csr || '—',
                      statut: prf.statut || '—',
                      km: parseFloat(prf.km) || 0
                    });
                  });
                }
              }
            });
            if (rawCsvData.length === 0 && allActivite.length > 0) {
              rawCsvData = allActivite;
              console.log(`[Supabase] Auto-chargé ${allActivite.length} activités/segments depuis les équipes.`);
            }
          }
        } catch (errAct) {
          console.warn("Impossible d'auto-charger numiplan_teams:", errAct);
        }

        // 1. Lire np_dispo (état live de la flotte)
        const { data: dispoList, error: errD } = await supabaseClient
          .from('np_dispo')
          .select('v,etat,geoloc,geoloc_date,team');
        if (errD) throw errD;

        // 2. Lire np_pannes sur la période
        const { data: pannesList, error: errP } = await supabaseClient
          .from('np_pannes')
          .select('date,immat,chauffeur,type,description,etat,team')
          .gte('date', startDate)
          .lte('date', endDate);
        if (errP) throw errP;
        rawPannesData = pannesList || [];

        // 3. Lire np_nc sur la période
        const { data: ncList, error: errN } = await supabaseClient
          .from('np_nc')
          .select('date,n,team,chgt,fausse,refus,autre')
          .gte('date', startDate)
          .lte('date', endDate);
        if (errN) throw errN;

        // 4. Lire np_flash_infos
        const { data: flashList, error: errF } = await supabaseClient
          .from('np_flash_infos')
          .select('titre, contenu, team')
          .order('created_at', { ascending: false })
          .limit(10);

        // 5. Lire np_bl (Bons de Livraison)
        const { data: blList, error: errBL } = await supabaseClient
          .from('np_bl')
          .select('team,chauffeur,mars,avril,mai,juin,juil,aout,sep,oct,nov,dec');
        if (errBL) throw errBL;

        // Map de correspondance camion -> équipe
        const truckToTeamMap = {};
        dispoList.forEach(d => {
          if (d.v && d.team) {
            truckToTeamMap[d.v.trim().toUpperCase()] = d.team.trim().toUpperCase();
          }
        });

        // Filtrer les listes selon l'agence sélectionnée
        const filteredDispos = dispoList.filter(d => isTeamInFilter(d.team, agencyFilter));
        const filteredPannes = pannesList.filter(p => isTeamInFilter(p.team, agencyFilter));
        const filteredNcs = ncList.filter(n => isTeamInFilter(n.team, agencyFilter));
        const filteredSegments = rawCsvData.filter(s => isSegmentInFilter(s, agencyFilter, truckToTeamMap));
        const filteredBls = blList.filter(b => isTeamInFilter(b.team, agencyFilter));

        // Processus et rendu des indicateurs
        renderKpis(filteredDispos, filteredPannes, filteredNcs, filteredSegments, filteredBls, truckToTeamMap);
        renderAvailabilityChart(filteredDispos);
        renderTables(filteredPannes, filteredNcs);
        let filteredFlashes = flashList || [];
        if (agencyFilter !== 'ALL') {
          filteredFlashes = filteredFlashes.filter(f => isTeamInFilter(f.team, agencyFilter));
        }

        renderFlashTicker(filteredSegments, filteredFlashes);
        

      } catch (err) {
        console.error("Erreur de chargement Supabase:", err);
      }
    }

    // Helper pour déterminer le statut d'un mois de BL (due / late / future)
    function checkBLMonthStatus(mKey, currentDate) {
      const monthIndexMap = {
        'mars': 2, 'avril': 3, 'mai': 4, 'juin': 5,
        'juil': 6, 'aout': 7, 'sep': 8, 'oct': 9,
        'nov': 10, 'dec': 11
      };

      const targetMonth = monthIndexMap[mKey];
      if (targetMonth === undefined) return 'future';

      const currentMonth = currentDate.getMonth();
      const currentDay = currentDate.getDate();

      if (currentMonth < targetMonth) {
        return 'future';
      }

      if (currentMonth === targetMonth) {
        if (currentDay >= 25) {
          return 'due';
        }
        return 'future';
      }

      if (currentMonth === targetMonth + 1) {
        if (currentDay <= 5) {
          return 'due';
        }
        return 'late';
      }

      return 'late';
    }

    // Générer le code HTML des 8 KPIs pour une agence spécifique
    
    // Calcul automatique du Roulage à Charge (RAC) depuis les données Odomètre de Numiplan
    function getTeamRACStats(db) {
      if (!db || !db.odo || !db.odo_weeks || db.odo_weeks.length < 2) return { fact: 0, odo: 0 };
      
      const numWeeks = db.odo_weeks.length;
      const counts = Array(numWeeks).fill(0);
      db.odo.forEach(item => {
        if (item.vals) {
          for (let i = 0; i < numWeeks; i++) {
            if (item.vals[i] && item.vals[i] > 1000) counts[i]++;
          }
        }
      });
      
      for (let w = numWeeks - 1; w >= 0; w--) {
        if (counts[w] > 0) {
          const stats = getTeamRACStatsForWeek(db, w);
          if (stats.odo > 0 && stats.fact > 0) {
            return stats;
          }
        }
      }
      
      for (let w = numWeeks - 1; w >= 0; w--) {
        if (counts[w] > 0) {
          return getTeamRACStatsForWeek(db, w);
        }
      }
      
      return { fact: 0, odo: 0 };
    }

    function getTeamRACStatsForWeek(db, lastWeekIdx) {
      let fact = 0;
      let odo = 0;

      if (!db || !db.odo) return { fact: 0, odo: 0 };

      db.odo.forEach(r => {
        const vLast = r.vals ? r.vals[lastWeekIdx] : null;
        if (vLast && vLast > 1000) {
          let prevIdx = -1;
          for (let k = lastWeekIdx - 1; k >= 0; k--) {
            if (r.vals && r.vals[k] && r.vals[k] > 1000) {
              prevIdx = k;
              break;
            }
          }
          if (prevIdx !== -1) {
            const vPrev = r.vals[prevIdx];
            const delta = vLast - vPrev;
            if (delta > 0 && delta <= 10000) {
              let kmF = 0;
              if (r.kmFactures && r.kmFactures[lastWeekIdx] !== undefined && r.kmFactures[lastWeekIdx] !== null) {
                kmF = r.kmFactures[lastWeekIdx];
              } else if (r.kmFacture !== undefined && r.kmFacture !== null) {
                kmF = r.kmFacture;
              }
              if (kmF > 0) {
                fact += kmF;
                odo += delta;
              }
            }
          }
        }
      });

      return { fact, odo };
    }

      const d = uniqueDays.size || 1;

      if (segments) {
        segments.forEach(s => {
          const status = (s.statut || '').trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          if (status.includes('livre') || status.includes('cloture')) {
            livresCount++;

              </div>
              <i class="fa-solid fa-wrench kpi-icon"></i>
            </div>

            <!-- KPI 7 : Roulage à charge (Synchronisé Numiplan) -->
            <div class="kpi-card orange" style="position: relative;">
              <div class="kpi-info">
                <h3 style="display: flex; align-items: center; gap: 8px;">
                  Roulage à Charge
                </h3>
                <div class="kpi-value">${roulageStr}</div>
                <div class="kpi-subtext">${racSubtext}</div>
              </div>
              <i class="fa-solid fa-gauge-high kpi-icon"></i>
            </div>

            <!-- KPI 8 : Chauffeurs BL Manquants -->
            <div class="kpi-card red">
              <div class="kpi-info">
                <h3>Chauffeurs BL Manquants</h3>
                <div class="kpi-value">${blManquantsCount}</div>
                <div class="kpi-subtext">Bons non restitués</div>
              </div>
              <i class="fa-solid fa-file-invoice kpi-icon"></i>
            </div>
          </div>

      `;
    }

    // Calcul des KPI globaux par agence distincte
    function renderKpis(dispos, pannes, ncs, segments, bls, truckToTeamMap) {
      const container = document.getElementById('kpis-container');
      if (!container) return;

      const agencyFilter = document.getElementById('agency-filter').value;
      
      let agenciesToRender = [];
      if (agencyFilter === 'ALL') {
        agenciesToRender = ['A', 'B', 'C', 'D'];
      } else if (agencyFilter === 'AB') {
        agenciesToRender = ['A', 'B'];
      } else if (agencyFilter === 'CD') {
        agenciesToRender = ['C', 'D'];
      } else {
        agenciesToRender = [agencyFilter];
      }

      let html = '';
      agenciesToRender.forEach(agency => {
        const dispos_eq = dispos.filter(d => d.team === agency);
        const pannes_eq = pannes.filter(p => p.team === agency);
        const ncs_eq = ncs.filter(n => n.team === agency);
        const bls_eq = bls.filter(b => b.team === agency);
        const segments_eq = segments ? segments.filter(s => isSegmentInFilter(s, agency, truckToTeamMap)) : [];
        
        html += generateAgencyKpisHtml(agency, dispos_eq, pannes_eq, ncs_eq, segments_eq, bls_eq);
      });
      
      container.innerHTML = html;
    }

    // Graphique Camembert Disponibilité
    function renderAvailabilityChart(dispos) {
      if (!document.getElementById('chart-availability')) return;
      const stats = {
        'Disponible': 0,
        'En Mission/Transit': 0,
        'En Panne': 0,
        'Repos/Autre': 0
      };

      dispos.forEach(d => {
        if (d.etat === 'DISPONIBLE') stats['Disponible']++;
        else if (d.etat === 'En mission' || d.etat === 'En transit') stats['En Mission/Transit']++;
        else if (d.etat === 'En panne' || d.etat === 'Panne') stats['En Panne']++;
        else stats['Repos/Autre']++;
      });

      if (charts['avail']) charts['avail'].destroy();

      const ctx = document.getElementById('chart-availability').getContext('2d');
      charts['avail'] = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: Object.keys(stats),
          datasets: [{
            data: Object.values(stats),
            backgroundColor: ['#10b981', '#38bdf8', '#ef4444', '#64748b'],
            borderWidth: 2,
            borderColor: '#0f172a'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: { color: '#f1f5f9', font: { weight: '600', size: 12 } }
            }
          }
        }
      });
    }

    // Rendu des tableaux d'historique
    function renderTables(pannes, ncs) {

      // 1. Tableau des pannes
      const pBody = document.querySelector('#table-pannes tbody');

        pBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Aucune panne signalée sur cette période.</td></tr>`;
      } else {

        pannes.forEach(p => {
          const isResolved = p.etat === 'Clôturé' || p.etat === 'Cloture';

            <tr>

              <td>${p.type || '—'}</td>

      }

      if (ncs.length === 0) {
        ncBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Aucune non-conformité enregistrée sur cette période.</td></tr>`;
      } else {
        const rows = [];
        ncs.forEach(n => {
          rows.push(`
            <tr>
              <td>${n.date || '—'}</td>
              <td style="font-weight: 600;">${n.n || '—'}</td>
              <td style="font-weight: 700; color: var(--accent-sky);">${n.team || '—'}</td>
              <td>${n.chgt ? '❌ OUI' : '—'}</td>
              <td>${n.fausse ? '❌ OUI' : '—'}</td>
              <td>${n.refus ? '❌ OUI' : '—'}</td>
              <td style="max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${n.autre || '—'}</td>
            </tr>

    // Gestion et rendu du ticker de news TV
    function renderFlashTicker(segments, flashes) {
      const tickerContainer = document.getElementById('ticker-content');
      const items = [];

      // 1. Calculer le rendement et le km moyen par jour pour chaque camion
      const trucksData = {};
      if (segments) {
        segments.forEach(s => {
          const tr = s.tracteur;
          if (!tr) return;
          
          if (!trucksData[tr]) {
            trucksData[tr] = {
              v: tr,
              chauffeur: s.chauffeur || '—',
              agence: s.agence || 'INCONNU',
              km: 0,
              dates: new Set()
            };
          }
          trucksData[tr].km += parseFloat(s.km) || 0;
          if (s.date) {
            trucksData[tr].dates.add(s.date);
          }
        });
      }

      // 2. Identifier les camions avec km moyen par jour <= 300km (seuil critique)
      Object.values(trucksData).forEach(row => {
        const uniqueDays = row.dates.size || 1;
        const avgPerDay = row.km / uniqueDays;
        
        if (avgPerDay <= 300) {
          items.push(`
            <div class="ticker-item" style="color: #fb923c;">
              <span class="ticker-dot" style="background: #f97316;"></span>
              ⚠️ SEUIL CRITIQUE : Camion ${row.v} (Chauffeur: ${row.chauffeur} - ${row.agence}) - Moyenne: ${Math.round(avgPerDay)} km/j
            </div>
          `);
        }
      });

      // 3. Ajouter les messages administratifs (flashes)
      if (flashes && flashes.length > 0) {
        flashes.forEach(f => {
          items.push(`
            <div class="ticker-item">
              <span class="ticker-dot"></span>
              ${f.titre}
            </div>
          `);
        });
      }

      // Ticker par défaut si vide
      if (items.length === 0) {
        items.push(`
          <div class="ticker-item"><span class="ticker-dot"></span>Aucun camion en seuil critique. Flotte sous contrôle.</div>
          <div class="ticker-item"><span class="ticker-dot"></span>Pensez à importer les derniers segments journaliers.</div>
        `);
      }
      
      tickerContainer.innerHTML = items.join('');
    }

    // Parser universel (CSV et Excel XLSX)
    function handleFileImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const fileName = file.name.toLowerCase();
      const isExcel = fileName.endsWith('.xlsx') || fileName.endsWith('.xls');

      const reader = new FileReader();
      reader.onload = async (e) => {
        let lines = [];
        
        if (isExcel) {
          try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            
            // Convertir en tableau de tableaux (format texte brut pour préserver les formats)
            const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false });
            lines = rawRows.map(row => row.map(cell => cell !== null && cell !== undefined ? String(cell) : ''));
          } catch (err) {
            console.error("Erreur de lecture Excel:", err);
            alert("Impossible de lire ce fichier Excel. Assurez-vous qu'il n'est pas corrompu.");
            return;
          }
        } else {
          // Lecture CSV classique
          const text = e.target.result;
          const rawLines = text.split(/\r?\n/);
          if (rawLines.length < 2) {
            alert("Le fichier est vide ou invalide.");
            return;
          }
          
          // Détection de délimiteur
          let semiCount = 0;
          let commaCount = 0;
          let tabCount = 0;
          for (let i = 0; i < Math.min(rawLines.length, 10); i++) {
            semiCount += (rawLines[i].match(/;/g) || []).length;
            commaCount += (rawLines[i].match(/,/g) || []).length;
            tabCount += (rawLines[i].match(/\t/g) || []).length;
          }
          let delimiter = ';';
          if (commaCount > semiCount && commaCount > tabCount) delimiter = ',';
          else if (tabCount > semiCount && tabCount > commaCount) delimiter = '\t';
          
          lines = rawLines.map(line => line.split(delimiter));
        }

        if (lines.length < 2) {
          alert("Le fichier ne contient pas assez de données.");
          return;
        }

        // Recherche de la ligne d'en-tête réelle (contenant date et tracteur)
        let headerIndex = -1;
        let indexMap = null;
        for (let i = 0; i < Math.min(lines.length, 50); i++) {
          const cells = lines[i].map(c => c.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""));
          const dateIdx = cells.findIndex(h => h.includes('date') || h === 'dt' || h.startsWith('dt.') || h.startsWith('dt ') || h.includes('d.dep') || h.includes('dt.dep'));
          const tracIdx = cells.findIndex(h => h.includes('tracteur') || h.includes('camion') || h.includes('immat') || h.includes('vehicule') || h.includes('trr'));
          
          if (dateIdx !== -1 && tracIdx !== -1) {
            headerIndex = i;
            indexMap = {
              date: dateIdx,
              tracteur: tracIdx,
              agence: cells.findIndex(h => h.includes('agence') || h.includes('site') || h.includes('depot')),
              chauffeur: cells.findIndex(h => h.includes('cond') || h.includes('chauffeur') || h.includes('pilote') || h.includes('affrete')),
              marchandise: cells.findIndex(h => h.includes('marchandise') || h.includes('produit')),
              csr: cells.findIndex(h => h.includes('csr') || h.includes('chef') || h.includes('nom de csr')),
              statut: (() => {
                const trackIdx = cells.findIndex(h => h.includes('tracking') || h === 'trck' || h.includes('track'));
                if (trackIdx !== -1) return trackIdx;
                return cells.findIndex(h => {
                  const norm = h.trim();
                  if (norm.includes('seg') || norm.includes('vehicule') || norm.includes('rep')) return false;
                  return norm.includes('statut') || norm.includes('etat') || norm.includes('situation') || norm.includes('phase') || norm.includes('etape') || norm.includes('ot') || norm.includes('progression') || norm.includes('stat');
                });
              })(),
              km: cells.findIndex(h => {
                const norm = h.trim().toLowerCase();
                return norm.includes('km exploitation') || norm.includes('exploitation') || norm === 'km' || norm.includes('kilometre');
              })
            };
            break;
          }
        }

        if (headerIndex === -1) {
          alert("Impossible de localiser la ligne d'en-tête avec les colonnes minimales requises (Date et Camion/Tracteur) dans votre fichier.");
          return;
        }

        console.log("Ligne d'en-tête trouvée à l'index :", headerIndex);
        console.log("Mapping des colonnes extrait :", indexMap);

        rawCsvData = [];
        
        // Parse des lignes
        for (let i = headerIndex + 1; i < lines.length; i++) {
          const cols = lines[i];
          if (cols.length < Math.max(indexMap.date, indexMap.tracteur) + 1) continue;

          // Nettoyage de la date du segment
          const rawDate = cols[indexMap.date]?.trim();
          const parsedDate = parseCsvDate(rawDate);
          
          if (!parsedDate) continue;

          rawCsvData.push({
            date: parsedDate,
            tracteur: cols[indexMap.tracteur]?.trim().toUpperCase(),
            agence: indexMap.agence !== -1 ? cols[indexMap.agence]?.trim() : 'INCONNU',
            chauffeur: indexMap.chauffeur !== -1 ? cols[indexMap.chauffeur]?.trim() : '—',
            marchandise: indexMap.marchandise !== -1 ? cols[indexMap.marchandise]?.trim() : '—',
            csr: indexMap.csr !== -1 ? cols[indexMap.csr]?.trim() : '—',
            statut: indexMap.statut !== -1 ? cols[indexMap.statut]?.trim() : '—',
            km: indexMap.km !== -1 ? parseFloat(String(cols[indexMap.km]).replace(/[\s,]+/g, '')) || 0 : 0
          });
        }

        try {
          localStorage.setItem('sharik_tv_raw_csv', JSON.stringify(rawCsvData.slice(0, 10000)));
        } catch(e) {}
        alert(`📥 Importation réussie ! ${rawCsvData.length} lignes de segments chargées.`);
        await refreshData();
      };
      
      if (isExcel) {
        reader.readAsArrayBuffer(file);
      } else {
        reader.readAsText(file);
      }
    }

    // Convertisseur de date robuste
    function parseCsvDate(dateStr) {
      if (!dateStr) return null;

      // Si c'est un nombre entier (date sérialisée d'Excel)
      const num = Number(dateStr);
      if (!isNaN(num) && num > 30000 && num < 60000) {
        const date = new Date((num - 25569) * 86400 * 1000);
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        return `${year}-${month}-${day}`;
      }
      
      // Format DD/MM/YYYY HH:MM ou DD/MM/YYYY
      const datePart = dateStr.trim().split(' ')[0];
      const parts = datePart.split('/');
      if (parts.length === 3) {
        const day = parts[0].padStart(2, '0');
        const month = parts[1].padStart(2, '0');
        const year = parts[2];
        return `${year}-${month}-${day}`;
      }
      
      // Format YYYY-MM-DD
      if (datePart.includes('-')) {
        return datePart.slice(0, 10);
      }
      return null;
    }

    // Croisement des données CSV + Supabase
    function processMergedData(csvList, dispos, pannes, truckToTeamMap) {
      const startDate = document.getElementById('date-start').value;
      const endDate = document.getElementById('date-end').value;

      // Filtrer les segments selon la période demandée
      const filteredCsv = csvList.filter(row => row.date >= startDate && row.date <= endDate);
      
      // Update KPI
      document.getElementById('kpi-segments').textContent = filteredCsv.length;

      // Rendu du graphique comparatif des rendements par équipe
      renderPerformanceChart(filteredCsv, pannes, truckToTeamMap);
      
      // Rendu du graphique des agences d'arrivée du fichier CSV
      renderAgenciesCsvChart(filteredCsv);

      // Rendu du top camions
      renderTopTrucksChart(filteredCsv);
    }

    // Graphique Performance par Équipe (A B C D E F)
    function renderPerformanceChart(segments, pannes, truckToTeamMap) {
      const agencyFilter = document.getElementById('agency-filter').value;
      
      // Déterminer les colonnes à afficher
      let activeLabels = ['A', 'B', 'C', 'D', 'E', 'F'];
      if (agencyFilter === 'A') activeLabels = ['A'];
      else if (agencyFilter === 'B') activeLabels = ['B'];
      else if (agencyFilter === 'C') activeLabels = ['C'];
      else if (agencyFilter === 'D') activeLabels = ['D'];
      else if (agencyFilter === 'AB') activeLabels = ['A', 'B'];
      else if (agencyFilter === 'CD') activeLabels = ['C', 'D'];

      const teamStats = {};
      activeLabels.forEach(label => {
        teamStats[label] = { segments: 0, pannes: 0 };
      });

      // Compter les pannes par équipe
      pannes.forEach(p => {
        const team = (p.team || '').trim().toUpperCase();
        if (teamStats[team]) teamStats[team].pannes++;
      });

      // Compter les segments par équipe réelle (Supabase) ou par défaut agence
      segments.forEach(s => {
        const immat = (s.tracteur || '').trim().toUpperCase();
        let targetTeam = truckToTeamMap[immat];
        
        if (!targetTeam && s.agence) {
          const agUpper = s.agence.toUpperCase();
          if (agUpper.includes('PART A') || agUpper.includes('AGENCE A') || agUpper === 'A') targetTeam = 'A';
          else if (agUpper.includes('PART B') || agUpper.includes('AGENCE B') || agUpper === 'B') targetTeam = 'B';
          else if (agUpper.includes('PART C') || agUpper.includes('AGENCE C') || agUpper === 'C') targetTeam = 'C';
          else if (agUpper.includes('PART D') || agUpper.includes('AGENCE D') || agUpper === 'D') targetTeam = 'D';
        }

        if (targetTeam && teamStats[targetTeam]) {
          teamStats[targetTeam].segments++;
        }
      });

      if (charts['performance']) charts['performance'].destroy();

      const ctx = document.getElementById('chart-performance').getContext('2d');
      charts['performance'] = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: Object.keys(teamStats).map(t => 'Agence ' + t),
          datasets: [
            {
              label: 'Nombre de Chargements (Segments)',
              data: Object.values(teamStats).map(t => Number.isFinite(t.segments) ? t.segments : 0),
              backgroundColor: 'rgba(56, 189, 248, 0.75)',
              borderColor: '#38bdf8',
              borderWidth: 1
            },
            {
              label: 'Pannes Signalées',
              data: Object.values(teamStats).map(t => Number.isFinite(t.pannes) ? t.pannes : 0),
              backgroundColor: 'rgba(239, 68, 68, 0.75)',
              borderColor: '#ef4444',
              borderWidth: 1
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { grid: { display: false }, ticks: { color: '#94a3b8' } },
            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } }
          },
          plugins: {
            legend: { labels: { color: '#f1f5f9' } }
          }
        }
      });
    }

    // Graphique Camembert Agences d'arrivée du fichier CSV
    function renderAgenciesCsvChart(segments) {
      const agencyCounts = {};
      segments.forEach(s => {
        const agency = s.agence || 'INCONNU';
        agencyCounts[agency] = (agencyCounts[agency] || 0) + 1;
      });

      // Garder le top 6 et grouper le reste
      const sorted = Object.entries(agencyCounts).sort((a,b) => b[1] - a[1]);
      const labels = [];
      const data = [];
      
      sorted.slice(0, 5).forEach(e => {
        labels.push(e[0]);
        data.push(e[1]);
      });
      
      if (sorted.length > 5) {
        labels.push('AUTRES');
        const restSum = sorted.slice(5).reduce((sum, e) => sum + e[1], 0);
        data.push(restSum);
      }

      if (charts['agencies-csv']) charts['agencies-csv'].destroy();

      const ctx = document.getElementById('chart-agencies-csv').getContext('2d');
      charts['agencies-csv'] = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: labels,
          datasets: [{
            data: data,
            backgroundColor: ['#0ea5e9', '#10b981', '#fb923c', '#a855f7', '#ec4899', '#64748b'],
            borderWidth: 2,
            borderColor: '#0f172a'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'right',
              labels: { color: '#f1f5f9', font: { weight: '600' } }
            }
          }
        }
      });
    }

    // Graphique Top Camions les plus sollicités
    function renderTopTrucksChart(segments) {
      const truckCounts = {};
      segments.forEach(s => {
        const trVal = (s.tracteur || '').trim();
        if (trVal) {
          truckCounts[trVal] = (truckCounts[trVal] || 0) + 1;
        }
      });

      const sorted = Object.entries(truckCounts).sort((a,b) => b[1] - a[1]).slice(0, 10);
      
      if (charts['top-trucks']) charts['top-trucks'].destroy();

      const ctx = document.getElementById('chart-top-trucks').getContext('2d');
      charts['top-trucks'] = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: sorted.map(e => e[0]),
          datasets: [{
            label: 'Nombre de chargements',
            data: sorted.map(e => e[1]),
            backgroundColor: 'rgba(16, 185, 129, 0.75)',
            borderColor: '#10b981',
            borderWidth: 1
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
            y: { grid: { display: false }, ticks: { color: '#94a3b8' } }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });
    }

  </script>
